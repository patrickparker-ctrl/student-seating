<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coaching Seating Chart</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f7f6; }
        .setup { margin-bottom: 20px; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-container { display: grid; gap: 10px; margin-top: 20px; }
        .cell { 
            height: 100px; border: 2px solid #bdc3c7; background: white; 
            border-radius: 8px; display: flex; align-items: center; justify-content: center;
            padding: 5px; cursor: pointer; text-align: center; font-size: 14px;
        }
        .cell:hover { background: #eef; }
        .cell.active { border-color: #2980b9; background: #ebf5fb; color: #2980b9; }
        [contenteditable]:focus { outline: 2px solid #2980b9; background: white; }
        button { padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }

        /* Added back the PDF print styling so exports look clean */
        @media print {
            body { background: white; padding: 0; }
            .setup { display: none !important; }
            .cell:not(.active) { visibility: hidden; border: none; }
            .cell { border: 2px solid #333 !important; color: black !important; }
        }
    </style>
</head>
<body>

    <div class="setup">
        <h2>1. Configure Room</h2>
        Rows: <input type="number" id="rows" value="5" style="width: 50px;">
        Columns: <input type="number" id="cols" value="6" style="width: 50px;">
        <button onclick="generateGrid()">Generate New Room</button>
        <button onclick="window.print()" style="background:#2980b9">Export PDF</button>
        <span id="save-status" style="margin-left: 15px; color: #27ae60; font-weight: bold;"></span>
    </div>

    <div id="classroom" class="grid-container"></div>

    <script>
        // Save the current room layout and notes to the browser's memory
        function saveRoom() {
            const rows = document.getElementById('rows').value;
            const cols = document.getElementById('cols').value;
            const cells = document.querySelectorAll('.cell');
            
            const roomData = {
                rows: rows,
                cols: cols,
                cellData: []
            };

            cells.forEach(cell => {
                roomData.cellData.push({
                    active: cell.classList.contains('active'),
                    text: cell.innerText
                });
            });

            localStorage.setItem('coachingRoom', JSON.stringify(roomData));
            
            // Show a quick "Saved!" indicator
            const status = document.getElementById('save-status');
            status.innerText = "Saved!";
            setTimeout(() => status.innerText = "", 2000);
        }

        // Generate a brand new, empty room
        function generateGrid() {
            const container = document.getElementById('classroom');
            const rows = document.getElementById('rows').value;
            const cols = document.getElementById('cols').value;
            
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let i = 0; i < rows * cols; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = "Click to Activate";
                
                cell.onclick = function() {
                    if (!this.classList.contains('active')) {
                        this.classList.add('active');
                        this.innerText = "";
                        this.setAttribute('contenteditable', 'true');
                        this.focus();
                        saveRoom(); // Save as soon as we activate a desk
                    }
                };

                // Auto-save whenever you type or click away
                cell.onkeyup = saveRoom;
                cell.onblur = saveRoom;

                container.appendChild(cell);
            }
            saveRoom(); // Save the new empty layout
        }

        // Load the room from memory when the page opens
        function loadRoom() {
            const saved = localStorage.getItem('coachingRoom');
            if (saved) {
                const roomData = JSON.parse(saved);
                document.getElementById('rows').value = roomData.rows;
                document.getElementById('cols').value = roomData.cols;
                
                const container = document.getElementById('classroom');
                container.innerHTML = '';
                container.style.gridTemplateColumns = `repeat(${roomData.cols}, 1fr)`;

                roomData.cellData.forEach((data) => {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (data.active) {
                        cell.classList.add('active');
                        cell.innerText = data.text;
                        cell.setAttribute('contenteditable', 'true');
                    } else {
                        cell.innerText = "Click to Activate";
                    }
                    
                    cell.onclick = function() {
                        if (!this.classList.contains('active')) {
                            this.classList.add('active');
                            this.innerText = "";
                            this.setAttribute('contenteditable', 'true');
                            this.focus();
                            saveRoom();
                        }
                    };

                    cell.onkeyup = saveRoom;
                    cell.onblur = saveRoom;
                    
                    container.appendChild(cell);
                });
            } else {
                generateGrid(); // If no save exists, make a default room
            }
        }

        // Start loading as soon as the app opens
        window.onload = loadRoom;
    </script>
</body>
</html>
